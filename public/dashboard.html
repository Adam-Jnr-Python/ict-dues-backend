<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="./css/dashboard.css" />
  </head>
  <body>
    <div class="container">
      <!-- MOBILE HAMBURGER -->
      <button id="mobileMenuBtn" class="mobile-menu-btn" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- SIDEBAR OVERLAY (mobile) -->
      <div id="sidebarOverlay" class="sidebar-overlay"></div>

      <!-- SIDEBAR -->
      <div class="sidebar" id="sidebar">
        <button
          id="sidebarCloseBtn"
          class="sidebar-close-btn"
          aria-label="Close menu">
          ✕
        </button>

        <div class="sidebar-brand">
          <div class="logo-box" id="logoBox" title="Click to change logo">
            <img id="deptLogo" src="" alt="Logo" class="dept-logo" />
            <span id="logoPlaceholder" class="logo-placeholder">+</span>
          </div>
          <h2 id="deptName" class="dept-name">MaISA</h2>
        </div>

        <input
          type="file"
          id="logoInput"
          accept="image/*"
          style="display: none" />

        <ul>
          <li class="active" onclick="window.location.href = 'dashboard.html'">
            Dashboard
          </li>
          <li onclick="window.location.href = 'set-dues.html'">Set Dues</li>
          <li onclick="window.location.href = 'students.html'">Students</li>
          <li onclick="window.location.href = 'expenses.html'">Expenses</li>
          <li id="logoutBtn">Logout</li>
        </ul>
      </div>

      <!-- MAIN CONTENT -->
      <div class="main">
        <!-- HEADER -->
        <div class="header">
          <h1>Dashboard</h1>
          <div
            style="
              display: flex;
              gap: 10px;
              align-items: center;
              flex-wrap: wrap;
            ">
            <button
              onclick="window.location.href = 'expenses.html'"
              class="btn-primary"
              style="margin-left: 10px">
              Expenses
            </button>

            <button
              id="exportStudentsBtn"
              class="btn-secondary btn-export-students">
              Export Students
            </button>
            <button
              id="exportExpensesBtn"
              class="btn-secondary btn-export-expenses">
              Export Expenses
            </button>
          </div>
        </div>

        <!-- CARDS -->
        <div class="cards">
          <div class="card">
            <h3>Total Students</h3>
            <p id="totalStudents">0</p>
          </div>
          <div class="card">
            <h3>Fully Paid</h3>
            <p id="totalPaid">0</p>
          </div>
          <div class="card">
            <h3>Total Money Received</h3>
            <p id="totalMoney">GH¢0</p>
          </div>
          <div class="card">
            <h3>Students Owing</h3>
            <p id="owing">0</p>
          </div>
          <div class="card">
            <h3>Total Expenses</h3>
            <p id="totalExpenses">₦0</p>
          </div>
          <div class="card">
            <h3>Net Balance</h3>
            <p id="netBalance" style="color: #10b981">₦0</p>
          </div>
        </div>
      </div>
    </div>

    <script src="./js/utils.js"></script>
    <script src="./js/dashboard.js"></script>
  </body>
</html>
