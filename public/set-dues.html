<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set Dues</title>
    <link rel="stylesheet" href="./css/dashboard.css" />
    <link rel="stylesheet" href="./css/set-dues.css" />
  </head>
  <body>
    <div class="container">
      <!-- MOBILE HAMBURGER -->
      <button id="mobileMenuBtn" class="mobile-menu-btn" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- SIDEBAR OVERLAY (mobile) -->
      <div id="sidebarOverlay" class="sidebar-overlay"></div>

      <!-- SIDEBAR -->
      <div class="sidebar" id="sidebar">
        <button
          id="sidebarCloseBtn"
          class="sidebar-close-btn"
          aria-label="Close menu">
          ✕
        </button>

        <div class="sidebar-brand">
          <div class="logo-box" id="logoBox" title="Click to change logo">
            <img id="deptLogo" src="" alt="Logo" class="dept-logo" />
            <span id="logoPlaceholder" class="logo-placeholder">+</span>
          </div>
          <h2 id="deptName" class="dept-name">MaISA</h2>
        </div>

        <input
          type="file"
          id="logoInput"
          accept="image/*"
          style="display: none" />

        <ul>
          <li onclick="window.location.href = 'dashboard.html'">Dashboard</li>
          <li class="active" onclick="window.location.href = 'set-dues.html'">
            Set Dues
          </li>
          <li onclick="window.location.href = 'students.html'">Students</li>
          <li onclick="window.location.href = 'expenses.html'">Expenses</li>
          <li id="logoutBtn">Logout</li>
        </ul>
      </div>

      <!-- MAIN CONTENT -->
      <div class="main">
        <!-- HEADER -->
        <div class="header">
          <h2>Set Department Dues</h2>
        </div>

        <!-- SET DUES FORM -->
        <div class="dues-form">
          <div class="form-group">
            <label for="department">Department</label>
            <input
              type="text"
              id="department"
              placeholder="Enter department"
              required />
          </div>

          <div class="form-group">
            <label for="level">Level</label>
            <select id="level">
              <option value="">Select Level</option>
              <option value="100">100</option>
              <option value="200">200</option>
              <option value="300">300</option>
              <option value="400">400</option>
            </select>
          </div>

          <div class="form-group">
            <label for="amount">Dues Amount (GH¢)</label>
            <input
              type="number"
              id="amount"
              placeholder="Enter amount e.g. 500"
              min="0"
              step="50" />
          </div>

          <button id="setDuesBtn" class="btn-primary">Set Dues</button>
          <button id="updateDuesBtn" class="btn-secondary">Update Dues</button>
        </div>

        <!-- MESSAGE -->
        <div id="duesMessage"></div>

        <!-- CURRENT DUES TABLE -->
        <div class="dues-table-container">
          <h3>Current Department Dues</h3>
          <table>
            <thead>
              <tr>
                <th>Department</th>
                <th>Level</th>
                <th>Amount (GH¢)</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="duesTable">
              <tr>
                <td colspan="3" id="load">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- EDIT MODAL -->
        <div id="editModal" class="modal">
          <div class="modal-content">
            <h3>Edit Dues</h3>
            <label for="editDepartment">Department</label>
            <input type="text" id="editDepartment" disabled />

            <input
              type="number"
              id="editAmount"
              placeholder="New Amount"
              min="0"
              step="100" />
            <div class="modal-actions">
              <button id="saveEditBtn" class="btn-primary">Save</button>
              <button id="closeEditModal" class="btn-secondary">Cancel</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./js/utils.js"></script>
    <script src="./js/set-dues.js"></script>
  </body>
</html>
